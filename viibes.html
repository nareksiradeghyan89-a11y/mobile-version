        height: 60px;
        top: 15px;
        right: 15px;
      }
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      box-shadow: var(--glass-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 90, 90, 0.6);
      box-shadow: 0 12px 40px rgba(220, 38, 38, 0.4);
    }

    .img-wrapper {
      width: 100%;
      height: 180px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card:hover .card-img {
      transform: scale(1.08);
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
      line-height: 1.35;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 10px;
    }

    .price-container {
      display: flex;
      flex-direction: column;
    }

    .price {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--red-hover);
      line-height: 1.1;
    }

    .old-price {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: line-through;
      margin-top: 2px;
    }

      color: #fff;
      border: none;

    function renderMenu() {
      const grid = document.getElementById('menu-grid');
      if (!grid) return;

      grid.innerHTML = menuData.map(item => {
        const prices = item.price.split('\n');
        const currentPrice = prices[0];
        const oldPrice = prices[1] ? prices[1] : null;

        const priceHTML = oldPrice 
          ? `<div class="price-container">
               <span class="price">${currentPrice}</span>
               <span class="old-price">${oldPrice}</span>
             </div>`
          : `<span class="price">${currentPrice}</span>`;

        return `
          <div class="card">
            <div class="img-wrapper">
              <img src="${item.img}" alt="${item.name}" class="card-img" loading="lazy" onerror="this.onerror=null; this.src='https://glovo.dhmedia.io/image/global-menu-service/GV_AM/vendor/641471/PRODUCT/12329b09-2a06-4d8d-aa50-c913be8ebb2a.jpg';">
            </div>
            <div class="card-body">
              <h4 class="card-title">${item.name}</h4>
              <div class="card-footer">
                ${priceHTML}
                <a href="https://glovoapp.com/am/en/yerevan/shawarma-vibes-yev/" target="_blank" class="order-btn">
                  Glovo <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', renderMenu);
  </script>
